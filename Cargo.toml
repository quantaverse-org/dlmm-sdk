[workspace]
members = ["cli", "commons", "market_making"]
resolver = "2"

[workspace.dependencies]
anchor-lang = { version = "1.2.1", default-features = false, features = [
    "solana-v4",
    "init-if-needed",
] }
anchor-spl = { version = "1.2.1", default-features = false, features = [
    "solana-v4",
    "associated_token",
    "mint",
    "token",
    "token_2022",
    "token_2022_extensions",
] }
anchor-client = { version = "=1.2.1", default-features = false, features = ["solana-v4", "async"] }

solana-account = "4.4.0"
solana-clock = { version = "3.2.0", features = ["serde"] }
solana-compute-budget-interface = "3.1.0"
solana-keypair = "3.1.2"
solana-rpc-client = { version = "~4.3.0", features = ["agave-unstable-api"] }
solana-rpc-client-api = { version = "~4.3.0", features = ["agave-unstable-api"] }
solana-sdk-ids = "3.1.0"
solana-signature = "3.6.0"
spl-memo-interface = "2.1.0"
spl-transfer-hook-interface = "2.1.0"

serde_json = "1.0.140"
serde = "1.0.219"
bincode = "1.3.3"
bs58 = "0.5.0"
bytemuck = "1.20.0"

clap = "4.3.3"
shellexpand = "3.1.0"

env_logger = "0.9.0"
log = "0.4.17"

rust_decimal = "1.31.0"
ruint = "1.3.0"
num-integer = "0.1.45"
num-traits = "0.2.19"

hyper = "0.14.17"
routerify = "3"

tokio = "^1.0"
futures-util = "0.3.0"
async-trait = "0.1.0"

anyhow = "1.0.71"

rand = "0.8.5"

chrono = "0.4.31"

ureq = "2.0.0"

itertools = "0.10.0"

commons = { path = "./commons" }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
