[package]
name = "commons"
version = "0.3.3"
edition = "2021"
publish = false
description = "Common libraries for DLMM"
authors = ["tian <tian@racoons.dev>"]

[features]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["full", "parking_lot"] }
bincode = { workspace = true }
solana-account = { workspace = true }
solana-clock = { workspace = true }
solana-rpc-client = { workspace = true }
solana-rpc-client-api = { workspace = true }
ruint = { workspace = true }
num-traits = { workspace = true }
num-integer = { workspace = true }
bytemuck = { workspace = true, features = ["derive", "min_const_generics"] }
async-trait = { workspace = true }
spl-transfer-hook-interface = { workspace = true }

[dev-dependencies]
solana-keypair = { workspace = true }
solana-native-token = "3.0.0"
solana-program-test = { version = "~4.3.0", features = ["agave-unstable-api"] }
solana-sdk-ids = { workspace = true }
solana-signer = "3.0.1"
solana-transaction = { version = "4.2.0", features = ["wincode"] }
assert_matches = "1.5.0"
spl-memo-interface = { workspace = true }
serde_json = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("idl-build"))',
] }
